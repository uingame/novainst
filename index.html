<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Technology Institute</title>
<meta name="description" content="Nova Technology Institute LLC helps school districts, school boards, and K-12 schools achieve strategic education goals and overcome STEM learning challenges through complete instructional support.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#top"><img src="images/logo.png" alt="Nova Technology Institute" width="320" height="101"></a>
    <nav class="nav">
      <a href="#about">About</a>
      <a href="#programs">Services</a>
      <a href="#experience">Experience</a>
      <a href="#company">Company Data</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <div class="container hero-inner">
      <div class="hero-text">
      <p class="eyebrow" data-field="hero.eyebrow"></p>
      <h1 data-field="hero.headline"></h1>
      <p class="subtext" data-field="hero.subtext"></p>
      <a class="btn" data-field="hero.cta_label" data-href-field="hero.cta_link" href="#contact"></a>
      </div>
      <img class="hero-image" src="images/hero-computer-class.jpg" alt="Students working together at a computer in a school computer class" width="1400" height="933">
    </div>
  </section>

  <section class="credentials" aria-label="Credentials">
    <div class="container">
      <ul class="credentials-list" id="credentials-list"></ul>
    </div>
  </section>

  <section class="section" id="about">
    <div class="container about-inner">
      <div>
        <h2 data-field="about.heading"></h2>
        <p class="lead" data-field="about.body"></p>
      </div>
      <img class="about-image" src="images/teacher-in-class.jpg" alt="A teacher with two students working at a computer in class" width="1400" height="933">
    </div>
  </section>

  <section class="section alt" id="programs">
    <div class="container">
      <h2 data-field="programs.heading"></h2>
      <div class="cards" id="programs-list"></div>
    </div>
  </section>

  <section class="section" id="experience">
    <div class="container">
      <h2 data-field="founder.heading"></h2>
      <p class="lead" data-field="founder.body"></p>
      <div class="cards" id="founder-list"></div>
    </div>
  </section>

  <section class="section alt" id="company">
    <div class="container">
      <h2 data-field="company.heading"></h2>
      <div class="data-table" id="company-list"></div>
    </div>
  </section>

  <section class="section" id="contact">
    <div class="container">
      <h2 data-field="contact.heading"></h2>
      <p class="lead" data-field="contact.body"></p>
      <div class="contact-details" id="contact-details"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p data-field="footer.text"></p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
